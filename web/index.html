<!doctype html><html lang=en><head><meta charset=utf-8><meta name=robots content=noindex><meta name=viewport content="width=device-width,initial-scale=1"><title>Printed sheet, site style</title><style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:28px;background:#f4f6f6;color:#1b1b1b}
h1{font-size:22px;margin:0 0 4px}p{color:#555;margin:0 0 18px}a{color:#125c65}
h2{font-size:15px;color:#125c65;margin:26px 0 10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:18px}
figure{margin:0;background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
img{width:100%;display:block;border-radius:6px;border:1px solid #e3e8e8}
@media(max-width:900px){.g{grid-template-columns:1fr}}
figcaption{font-size:13px;color:#555;margin-top:8px}.p{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:18px}</style></head><body>
<h1>Web page: chapters on the spine (15 Oct)</h1><p>Class clip playing, chapter 4 is the current one. Compare with the <a href=../sheet/>printed sheet</a>.</p>
<h2>Desktop</h2><div class=g>
<figure><a href=desk.png><img src=desk.png></a><figcaption>English</figcaption></figure>
<figure><a href=desk-de.png><img src=desk-de.png></a><figcaption>German</figcaption></figure>
</div>
<h2>Tablet</h2><div class=g>
<figure><a href=tablet.png><img src=tablet.png></a><figcaption>English, 820 wide</figcaption></figure>
</div>
<h2>Phone</h2><div class=p>
<figure><a href=phone.png><img src=phone.png></a><figcaption>Top of the page</figcaption></figure>
<figure><a href=phone-list.png><img src=phone-list.png></a><figcaption>Chapter list</figcaption></figure>
</div>
</body></html>
